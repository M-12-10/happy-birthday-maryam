              sheet.classList.add("is-instant", "is-packed", "is-fold-top", "is-fold-bot");
              sheet.classList.toggle("is-flat", reduce);
              scroller.scrollTop = 0;
              if (!reduce) buildFolds();
              void sheet.offsetWidth;
              sheet.classList.remove("is-instant", "is-packed");
              sheet.classList.add("is-on");
              sheet.setAttribute("aria-hidden", "false");
            }, 1150);
            lLater(function () { sheet.classList.remove("is-fold-top"); }, 1650);
            lLater(function () { sheet.classList.remove("is-fold-bot"); }, 2150);
            lLater(function () {
              sheet.classList.add("is-flat");
              folds.innerHTML = "";
              lState = "open";
              paper.focus({ preventScroll: true });
            }, 2750);
          }
          function closeLetter() {
            if (lState !== "open") return;
            lState = "closing";
            if (!reduce) {
              buildFolds();
              var mid = wrap.offsetTop + paper.offsetHeight / 2 - scroller.clientHeight / 2;
              scroller.scrollTo({ top: Math.max(0, mid), behavior: "smooth" });
              sheet.classList.remove("is-flat");
            }
            lLater(function () { sheet.classList.add("is-fold-bot"); }, 40);
            lLater(function () { sheet.classList.add("is-fold-top"); }, 580);
            lLater(function () { sheet.classList.add("is-packed"); }, 1120);
            lLater(function () {
              sheet.classList.remove("is-on");
              sheet.setAttribute("aria-hidden", "true");
              document.documentElement.style.overflow = "";
              env.focus({ preventScroll: true });
            }, 1300);
            lLater(function () { env.classList.remove("is-out"); }, 1500);
            lLater(function () { env.classList.remove("is-flap"); }, 1950);
            lLater(function () { env.classList.remove("is-cracked"); }, 2500);
            lLater(function () {
              folds.innerHTML = "";
              env.setAttribute("aria-expanded", "false");
              lState = "closed";
            }, 2950);
          }
          env.addEventListener("click", openLetter);
          xBtn.addEventListener("click", closeLetter);
          foldBtn.addEventListener("click", closeLetter);
          scroller.addEventListener("click", function (e) { if (!e.target.closest(".x-paper, .x-sheet__fold")) closeLetter(); });
          document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeLetter(); });
          sheet.addEventListener("keydown", function (e) {
            if (e.key !== "Tab") return;
            var f = [xBtn, foldBtn], i = f.indexOf(document.activeElement);
            e.preventDefault();
            f[i === -1 ? 0 : (i + 1) % 2].focus();
          });

          /* candles: tap to blow */
          var wish = document.getElementById("wish-box");
          var candles = [].slice.call(wish.querySelectorAll(".x-candle"));
          var ctl = document.getElementById("wish-ctl");
          var blowBtn = document.getElementById("blow");
          var wished = document.getElementById("wished");
          var msg = document.getElementById("wish-msg");
          var again = document.getElementById("again");
          var dim = document.getElementById("dim");
          var busy = false, timers = [];
          function later(fn, ms) { timers.push(setTimeout(fn, reduce ? 0 : ms)); }
          function blow() {
            if (busy) return;
            busy = true;
            blowBtn.setAttribute("aria-disabled", "true");
            wish.classList.add("is-blowing");
            later(function () {
              wish.classList.remove("is-blowing");
              candles.forEach(function (c, i) { later(function () { c.classList.add("is-out"); }, i * 360); });
            }, 650);
            later(function () { wish.classList.add("is-dark"); }, 1400);
            later(function () { dim.classList.add("is-on"); }, 1750);
            later(function () {
              dim.classList.remove("is-on");
              ctl.hidden = true;
              wished.hidden = false;
              wished.classList.add("is-in");
              msg.focus({ preventScroll: true });
              wished.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
              confetti("wish");
            }, 2700);
          }
          blowBtn.addEventListener("click", blow);
          again.addEventListener("click", function () {
            timers.forEach(clearTimeout); timers = [];
            candles.forEach(function (c) { c.classList.remove("is-out"); });
            wish.classList.remove("is-dark");
            wished.classList.remove("is-in");
            wished.hidden = true;
            ctl.hidden = false;
            blowBtn.removeAttribute("aria-disabled");
            busy = false;
            blowBtn.focus({ preventScroll: true });
          });

          initRest();
        }

        var heart = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.2 0 3.6 1.2 5.3 3.2 1.7-2 3.1-3.2 5.3-3.2 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>';
        var star = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 7 3 9 10 10-7 1-9 3-10 10-1-7-3-9-10-10 7-1 9-3 10-10z"/></svg>';
        var bow = '<svg viewBox="-1 -1 50 34"><path fill="currentColor" d="M24 16C18 6 6 2 3 8s-1 16 5 19 12-5 16-11zM24 16c6-10 18-14 21-8s1 16-5 19-12-5-16-11z"/><ellipse cx="24" cy="16" rx="5" ry="6" fill="#e60033"/></svg>';

        /* slow floating bows, hearts and little stars */
        if (!reduce) {
          var layer = document.querySelector(".x-drift");
          var petal = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6 6 4 12 7 18c2 4 8 4 10 0 3-6 1-12-5-16z"/></svg>';
          var kinds = [petal, bow, heart, petal, star, heart];
          var tints = ["#ff8fb1", "#f7a8c0", "#ffc0d3", "#e60033"];
          var count = window.innerWidth < 480 ? 12 : window.innerWidth < 600 ? 16 : 20;
          for (var i = 0; i < count; i++) {
            var el = document.createElement("span");
            var isBow = kinds[i % kinds.length] === bow;
            var size = (isBow ? 20 : 11) + Math.random() * 10;
            var dur = 36 + Math.random() * 22;
            el.innerHTML = kinds[i % kinds.length];
            el.style.left = (Math.random() * 96) + "%";
            el.style.width = size + "px";
            el.style.height = (isBow ? size * 0.68 : size) + "px";
            el.style.color = i === 3 ? tints[3] : tints[i % 3];
            el.style.opacity = (0.22 + Math.random() * 0.16).toFixed(2);
            el.style.animationDuration = dur + "s";
            el.style.animationDelay = (-Math.random() * dur) + "s";
            layer.appendChild(el);
          }
        }

        function initRest() {
        /* photo lightbox: reuses the photo already on the page */
        var lb = document.getElementById("lightbox");
        var lbImg = document.getElementById("lightbox-img");
        var lbCap = document.getElementById("lightbox-cap");
        var lbClose = lb.querySelector(".x-lightbox__close");
        var lastBtn = null;
        function closeLb() {
          if (!lb.classList.contains("is-open")) return;
          lb.classList.remove("is-open");
          lb.setAttribute("aria-hidden", "true");
          document.documentElement.style.overflow = "";
          if (lastBtn) lastBtn.focus({ preventScroll: true });
        }
        document.querySelectorAll(".x-polaroid, .x-keep").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var img = btn.querySelector("img");
            lastBtn = btn;
            lbImg.src = img.currentSrc || img.src;
            lbImg.alt = img.alt;
            var capEl = btn.querySelector(".x-polaroid__cap");
            lbCap.textContent = btn.getAttribute("data-cap") || (capEl ? capEl.textContent : "");
            lb.classList.add("is-open");
            lb.setAttribute("aria-hidden", "false");
            document.documentElement.style.overflow = "hidden";
            lbClose.focus({ preventScroll: true });
          });
        });
        lb.addEventListener("click", closeLb);
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeLb(); });

        /* Papa ji's voice notes: one plays at a time, tap or drag the bar to seek, arrow keys too */
        var voices = [].slice.call(document.querySelectorAll(".x-voice"));
        function fmt(t) { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ":" + pad(t % 60); }
        voices.forEach(function (card) {
          var au = card.querySelector("audio");
          var btn = card.querySelector(".x-voice__play");
          var bar = card.querySelector(".x-voice__bar");
          var name = card.getAttribute("data-name") || "Papa ji's voice note";
          var fallback = parseFloat(card.getAttribute("data-duration")) || 0;
          var pending = null, dragging = false;
          function dur() { return isFinite(au.duration) && au.duration > 0 ? au.duration : fallback; }
          function now() { return pending !== null ? pending : au.currentTime; }
          function paint() {
            var d = dur(), t = Math.min(now(), d);
            bar.style.setProperty("--p", (d ? (t / d) * 100 : 0) + "%");
            bar.setAttribute("aria-valuemax", String(Math.round(d)));
            bar.setAttribute("aria-valuenow", String(Math.round(t)));
            bar.setAttribute("aria-valuetext", fmt(t) + " of " + fmt(d));
          }
          function seek(t) {
            t = Math.max(0, Math.min(dur(), t));
            if (au.readyState >= 1) { au.currentTime = t; pending = null; } else pending = t;
            paint();
          }
          function setState(on) {
            card.classList.toggle("is-playing", on);
            btn.setAttribute("aria-label", (on ? "Pause " : "Play ") + name);
          }
          btn.addEventListener("click", function () {
            if (au.paused) {
              voices.forEach(function (o) { if (o !== card) o.querySelector("audio").pause(); });
              var p = au.play();
              if (p && p.catch) p.catch(function () { setState(false); });
            } else au.pause();
          });
          au.addEventListener("loadedmetadata", function () { if (pending !== null) { au.currentTime = Math.min(pending, dur()); pending = null; } paint(); });
          au.addEventListener("play", function () { setState(true); });
          au.addEventListener("pause", function () { setState(false); });
          au.addEventListener("ended", function () { setState(false); au.currentTime = 0; paint(); });
          au.addEventListener("timeupdate", function () { if (!dragging) paint(); });
          function fromX(x) { var r = bar.getBoundingClientRect(); return ((x - r.left) / r.width) * dur(); }
          bar.addEventListener("pointerdown", function (e) {
            dragging = true;
            if (bar.setPointerCapture) bar.setPointerCapture(e.pointerId);
            seek(fromX(e.clientX));
          });
          bar.addEventListener("pointermove", function (e) { if (dragging) seek(fromX(e.clientX)); });
          function endDrag() { dragging = false; }
          bar.addEventListener("pointerup", endDrag);
          bar.addEventListener("pointercancel", endDrag);
          bar.addEventListener("keydown", function (e) {
            var k = e.key, t = now();
            if (k === "ArrowRight" || k === "ArrowUp") seek(t + 5);
            else if (k === "ArrowLeft" || k === "ArrowDown") seek(t - 5);
            else if (k === "PageUp") seek(t + 15);
            else if (k === "PageDown") seek(t - 15);
            else if (k === "Home") seek(0);
            else if (k === "End") seek(dur());
            else if (k === " " || k === "Enter") btn.click();
            else return;
            e.preventDefault();
          });
          paint();
        });

        /* quiet, faint stars for Abbu's night sky */
        var sky = document.querySelector(".x-sky");
        var starCount = window.innerWidth < 480 ? 12 : window.innerWidth < 600 ? 16 : 28;
        for (var j = 0; j < starCount; j++) {
          var st = document.createElement("span");
          var sz = 4 + Math.random() * 8;
          var d = 18 + Math.random() * 16;
          st.innerHTML = star;
          st.style.left = (Math.random() * 98) + "%";
          st.style.top = (16 + Math.random() * 68) + "%";
          st.style.width = sz + "px";
          st.style.height = sz + "px";
          st.style.animationDuration = d + "s";
          st.style.animationDelay = (-Math.random() * d) + "s";
          sky.appendChild(st);
        }

        /* scroll reveal with staggered groups, and pausing animated scenes while offscreen */
        if (!reduce && "IntersectionObserver" in window) {
          var targets = [];
          document.querySelectorAll(".main .head, .x-divider, .x-envelope, .x-polaroids > li, .x-kitty .cards > div, .x-kitty .step, .x-night .band, .x-ayah, .x-abbu__words, .x-keepsake, .x-voices, .x-dua, .x-wish, .x-closing, .x-jarwrap, .x-present").forEach(function (el) {
            var sib = el.parentElement ? [].slice.call(el.parentElement.children).filter(function (c) { return c.tagName === el.tagName; }) : [];
            var grouped = el.matches(".x-polaroids > li, .cards > div, .step");
            el.style.setProperty("--i", grouped ? Math.min(sib.indexOf(el), 6) : 0);
            el.classList.add("x-rv");
            targets.push(el);
          });
          var rio = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
              if (!e.isIntersecting) return;
              var el = e.target;
              rio.unobserve(el);
              el.classList.add("is-in");
              if (!el.classList.contains("x-divider")) setTimeout(function () { el.classList.remove("x-rv", "is-in"); el.style.removeProperty("--i"); }, 1500);
            });
          }, { rootMargin: "0px 0px -8% 0px", threshold: 0.12 });
          targets.forEach(function (el) { rio.observe(el); });

          var pio = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) { e.target.classList.toggle("is-paused", !e.isIntersecting); });
          }, { rootMargin: "120px 0px" });
          document.querySelectorAll(".main .hero, #letter, #openwhen, #abbu, #jar, #wish, #gift, #always").forEach(function (el) { pio.observe(el); });
        }

        initNew();
        }

        /* the interactive pieces: the reasons jar, the gift box */
        function initNew() {
          /* reasons jar: one at a time, in order 1 to 50, then a last line and a fresh start */
          var REASONS = JSON.parse(document.getElementById("reasons-data").textContent);
          var next = 0;
          var jar = document.getElementById("jar-btn");
          var jarHint = jar.querySelector(".x-jar__hint");
          var reason = document.getElementById("reason");
          var actx = null;
          function pop() {
            try {
              var AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) return;
              actx = actx || new AC();
              if (actx.state === "suspended") actx.resume();
              var t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
              o.type = "sine"; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(980, t + 0.08);
              g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
              o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.18);
            } catch (err) {}
          }
          jar.addEventListener("click", function () {
            var total = REASONS.length, count = document.createElement("span"), text = document.createElement("span");
            count.className = "x-reason__count";
            if (next < total) {
              count.textContent = "Reason " + (next + 1) + " of " + total;
              text.textContent = REASONS[next];
              next++;
              jarHint.textContent = next < total ? "Tap for the next one 💗" : "One more tap 💗";
            } else {
              count.textContent = "And after all " + total;
              text.textContent = "…and a million more, meri jaan ❤";
              next = 0;
              jarHint.textContent = "Start over from 1 💗";
            }
            reason.replaceChildren(count, text);
            reason.hidden = false;
            pop();
            if (reduce) return;
            reason.classList.remove("is-pop"); jar.classList.remove("is-shake");
            void reason.offsetWidth;
            reason.classList.add("is-pop"); jar.classList.add("is-shake");
          });

          /* the gift box: tap to untie the bow, lift the lid and raise the coupon; tap again to put it back */
          var present = document.getElementById("present");
          if (present) {
            var presentBtn = document.getElementById("present-btn");
            var presentCoupon = document.getElementById("present-coupon");
            var presentClose = document.getElementById("present-close");
            var presentHint = present.querySelector(".x-present__hint");
            var presentBusy = false, presentTimer = 0;
            function setPresent(open) {
              if (presentBusy) return;
              presentBusy = true;
              clearTimeout(presentTimer);
              present.classList.remove("is-open", "is-closing");
              void present.offsetWidth;
              present.classList.add(open ? "is-open" : "is-closing");
              presentBtn.setAttribute("aria-expanded", open ? "true" : "false");
              presentBtn.setAttribute("aria-label", open ? "Close your gift" : "Open your gift");
              presentCoupon.setAttribute("aria-hidden", open ? "false" : "true");
              presentClose.hidden = !open;
              if (open) pop();
              var ms = reduce ? (open ? 600 : 550) : (open ? 1600 : 1500);
              presentTimer = setTimeout(function () {
                presentBusy = false;
                if (!open) present.classList.remove("is-closing");
              }, ms);
            }
            function togglePresent() { setPresent(!present.classList.contains("is-open")); }
            presentBtn.addEventListener("click", togglePresent);
            presentCoupon.addEventListener("click", function () { if (present.classList.contains("is-open")) setPresent(false); });
            presentHint.addEventListener("click", function () { if (!present.classList.contains("is-open")) setPresent(true); });
            presentClose.addEventListener("click", function () { setPresent(false); presentBtn.focus({ preventScroll: true }); });
          }
        }

        /* before midnight in Faisalabad: only the teaser. ?preview=love opens it now, ?preview=teaser holds it shut */
        if (preview === "love" || (preview !== "teaser" && Date.now() >= TARGET)) reveal(false);
        else { tick(); timer = setInterval(tick, 1000); }
      })();
    </script>
